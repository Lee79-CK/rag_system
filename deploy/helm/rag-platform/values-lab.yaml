# values-lab.yaml — 로컬 2-Node RKE2 랩 (P3 amd64 + PGX arm64)
# 사용: rke2_two_node_test_guide.md §4
#   helm upgrade --install rag-platform deploy/helm/rag-platform \
#     -f deploy/helm/rag-platform/values-poc.yaml \
#     -f deploy/helm/rag-platform/values-lab.yaml \
#     --set global.imageTag=$TAG
#   ※ values.yaml → values-poc.yaml → 이 파일 순서로 겹쳐진다 (override 전용, 단독 사용 금지).
#
# 운영(PoC)과 다른 점 — 리포트에 반드시 기록할 것:
#   - vLLM replica 2 → 1 (GPU 노드 1대). NFR-HA-002 는 순차 재기동으로 대체 검증
#   - 앱 replica 2 → 1 (P3 20코어 한계). PDB 는 minAvailable 유지 시 rollout 이 막히므로 해제(null)
#   - 데이터 계층 용량 축소 (NVMe 1TB 공유 — 가이드 §1.4.1)
#   - max-num-seqs 16 → 8 (GB10 메모리 대역폭 ~273GB/s 고려)
#   - Namespace 는 가이드 §4.1 에서 kubectl 로 사전 생성 + 라벨 rag-platform=true (namespaces.create=false), Ingress Controller = RKE2 내장(kube-system)
#   - admin-web 을 appServices 로 추가 (admin host Ingress `/`)
#   - Web Chat 은 chat host(chat.rag.lab.local), 관리자는 admin host(rag.lab.local) — 브라우저 /etc/hosts → P3 IP
# ─────────────────────────────────────────────────────────────────────────────

global:
  imageRegistry: registry.local:5000
  imageTag: "dev"                 # --set global.imageTag=$(git rev-parse --short HEAD) 로 덮어쓴다
  imagePullPolicy: IfNotPresent

# ---- Namespace / NetworkPolicy / Ingress (chart 가 생성) ----
namespaces:
  # Secret(Namespace-scoped)을 helm install 이전에 만들어야 Pod 가 바로 뜨므로 랩에서는 NS 를 가이드 §4.1 에서
  # kubectl 로 먼저 만들고 라벨(rag-platform=true)을 붙인다. 완전 신규 GitOps 설치라면 true 로 chart 가 생성.
  create: false

networkPolicy:
  ingressController:
    namespace: kube-system        # RKE2 내장 ingress-nginx
    podSelector: { app.kubernetes.io/name: rke2-ingress-nginx }
  apiServer:
    enabled: true                 # admin-api → kube-apiserver (INDEX_JOB_TRIGGER=k8s)
    cidrs: ["192.168.0.10/32"]    # ★ P3(control-plane) 노드 IP 로 교체
    port: 6443

ingress:
  enabled: true
  className: nginx
  chatHost: chat.rag.lab.local    # 접속 PC /etc/hosts → P3 IP (chat-web + chat-gateway)
  adminHost: rag.lab.local        # admin-api /api · admin-web /
  # 랩 한정: 인증 프록시가 없으므로 클라이언트가 X-Auth-User 를 직접 보낸다 (admin-web 은 localStorage override).
  # prehash 로그인은 브라우저 WebCrypto 가 필요해 HTTPS 필수 → 자체서명 TLS Secret(가이드 §4.1) 지정
  tlsSecretName: rag-chat-tls
  annotations: {}

serviceAccounts:
  adminApi:
    create: true                  # rag-ingestion 에 Job 생성 권한 (templates/rbac.yaml)

migration:
  enabled: true                   # helm install/upgrade 시 alembic upgrade head (hook Job)

# ---- 스케줄링 ----
# 기본은 P3(amd64) 고정. PGX 는 dedicated=llm:NoSchedule taint 로도 막히지만,
# 이기종 클러스터에서 `exec format error` 를 원천 차단하려면 arch 라벨을 명시하는 편이 안전하다.
nodeSelector:
  kubernetes.io/arch: amd64
tolerations: []

# ---- 스토리지 티어 (가이드 §1.4 — 이 랩의 핵심) ----
data:
  storageClass: local-fast        # qdrant/postgresql/redis → NVMe
  # data 계층 image 는 global.imageRegistry 를 타지 않고 full string 이다 → 랩 레지스트리로 직접 교체.
  # 사전에 미러링: docker pull <원본> && docker tag ... registry.local:5000/library/<name> && docker push
  qdrant:
    image: registry.local:5000/library/qdrant:v1.12.1
    storage: 50Gi
    resources: { requests: { cpu: "2", memory: 8Gi } }
  postgresql:
    image: registry.local:5000/library/postgres:16
    storage: 20Gi
    resources: { requests: { cpu: "1", memory: 2Gi } }
  redis:
    image: registry.local:5000/library/redis:7
    storage: 10Gi
    resources: { requests: { cpu: "500m", memory: 1Gi } }

documentStorage:
  storageClass: local-bulk        # 문서 원본 → HDD (지정하지 않으면 default SC=local-fast(NVMe) 로 새어 들어간다)
  size: 500Gi

modelStorage:
  create: false                   # PVC 대신 hostPath 사용 → 빈 models-pvc 를 만들지 않는다
  hostPath: /data/bulk/models     # §2.2 다운로드 위치. 컨테이너 /models 로 마운트
                                  # → /models/embedding/kure-v1 (+ 비교용 bge-m3), /models/reranker/bge-reranker-v2-m3
                                  # ※ 사전 조치: sudo chmod -R a+rX /data/bulk/models
                                  #   (Pod 는 runAsUser 10001, hostPath 에는 fsGroup 이 적용되지 않음)

# ---- 애플리케이션 서비스 ----
# 공통: replica 1, PDB 해제, 리소스 축소(P3 20코어/128GB).
# 서비스 URL / DB / Redis / Secret 경로는 values.yaml 의 dbEnv·redisEnv·secretMount.keys 플래그와
# extraEnv 기본값(in-cluster DNS)이 이미 채운다 — 여기서는 랩에서 달라지는 값만 override 한다 (리스트는 통째로 교체됨).
appServices:
  chat-gateway:
    replicas: 1
    pdbMinAvailable: null
    resources: { requests: { cpu: "250m", memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
    extraEnv:
      # 랩은 자체서명 TLS(§4.1) 로 HTTPS 접속 → Secure 쿠키 유지. HTTP 로만 쓸 경우에만 "false"
      - { name: COOKIE_SECURE, value: "true" }
      - { name: CHAT_CORS_ORIGINS, value: "" }   # 동일 출처(Ingress) 만 허용
      - { name: LOG_LEVEL,     value: "INFO" }

  chat-web:
    replicas: 1
    pdbMinAvailable: null
    resources: { requests: { cpu: "100m", memory: 256Mi }, limits: { cpu: "500m", memory: 512Mi } }

  rag-api:
    replicas: 1
    pdbMinAvailable: null
    resources: { requests: { cpu: "500m", memory: 1Gi }, limits: { cpu: "2", memory: 3Gi } }
    extraEnv: &ragEnvLab
      - { name: QDRANT_URL,        value: "http://qdrant.rag-data:6333" }
      - { name: EMBEDDING_API_URL, value: "http://embedding-api.rag-ai:8004" }
      - { name: RERANKER_API_URL,  value: "http://reranker-api.rag-ai:8005" }
      - { name: VLLM_API_URL,      value: "http://vllm-service.rag-ai:8000/v1" }
      - { name: LLM_SERVED_MODEL_NAME, value: "internal-rag-llm" }
      # Qwen3.8 은 thinking 기본 on → RAG 는 요청마다 chat_template_kwargs.enable_thinking=false (첫 토큰 지연 방지)
      - { name: LLM_ENABLE_THINKING,   value: "false" }
      # 동시 15 → GB10 대역폭 고려 8 (가이드 §7.2) ※ 코드가 아직 semaphore 로 강제하지 않음 — 실효 동시성은 rag-worker replica 수
      - { name: CHAT_MAX_CONCURRENCY,  value: "8" }
      # tokenizer 는 LLM 노드(PGX)에만 있으므로 P3 의 rag-api 에서는 근사 카운팅 경로를 쓴다
      - { name: TOKENIZER_PATH,        value: "/models/llm/main" }

  rag-worker:
    replicas: 2                   # 큐 재처리 시나리오(§6) 검증에 필요
    pdbMinAvailable: null
    resources: { requests: { cpu: "500m", memory: 1Gi }, limits: { cpu: "2", memory: 3Gi } }
    extraEnv: *ragEnvLab

  admin-api:
    replicas: 1
    pdbMinAvailable: null
    resources: { requests: { cpu: "500m", memory: 1Gi }, limits: { cpu: "2", memory: 2Gi } }
    serviceAccountName: admin-api
    extraEnv:
      - { name: DOCUMENT_STORAGE_PATH, value: "/data/documents" }
      - { name: INDEX_JOB_TRIGGER,     value: "k8s" }        # 업로드/재색인 → parser-indexer Job 자동 생성
      - { name: INDEX_JOB_NAMESPACE,   value: "rag-ingestion" }
      - { name: APP_ENV,   value: "lab" }
      - { name: LOG_LEVEL, value: "INFO" }

  embedding-api:
    replicas: 1
    pdbMinAvailable: null
    # CPU 추론(KURE-v1 = 한글 파인튜닝 bge-m3, 568M). P3 Core Ultra 7 265 기준 — 색인 처리량이 부족하면 cpu limit 을 올린다
    resources: { requests: { cpu: "2", memory: 4Gi }, limits: { cpu: "6", memory: 8Gi } }
    startupFailureThreshold: 90   # HDD(/data/bulk) 에서 모델 로딩 → 최대 15분 허용
    extraEnv:
      # 한글 PDF 랩 기본 = KURE-v1 (가이드 §5.1.2). bge-m3 와 차원(1024)·토크나이저 동일 → collection 스키마 그대로,
      # 단 벡터 공간이 달라 모델을 바꾸면 전 문서 재색인 필수. 비교 기준선: "/models/embedding/bge-m3"
      - { name: EMBEDDING_MODEL_PATH, value: "/models/embedding/kure-v1" }
      - { name: EMBEDDING_MOCK,       value: "0" }   # 실모델. 모델 미배치 시 "1" (이미지에 --extra models 필요)
      # FlagEmbedding encode 기본 512 tok 절단 방지. 표 청크(최대 ≈1,100 tok)까지 포함
      - { name: EMBEDDING_MAX_LENGTH, value: "2048" }
      # 비대칭 모델(dragonkue/snowflake-arctic-embed-l-v2.0-ko)로 A/B 할 때만: "query: "
      - { name: EMBEDDING_QUERY_PREFIX, value: "" }

  reranker-api:
    replicas: 1
    pdbMinAvailable: null
    resources: { requests: { cpu: "4", memory: 6Gi }, limits: { cpu: "8", memory: 12Gi } }
    startupFailureThreshold: 90
    extraEnv:
      - { name: RERANKER_MODEL_PATH, value: "/models/reranker/bge-reranker-v2-m3" }
      - { name: RERANKER_MOCK,       value: "0" }

  # 관리자 Portal (nginx 정적 서빙, apps/admin-web/Containerfile). API 는 Ingress 가 /api 로 프록시
  admin-web:
    namespace: rag-app
    replicas: 1
    image: rag/admin-web
    port: 8080
    resources: { requests: { cpu: "50m", memory: 64Mi }, limits: { cpu: "500m", memory: 256Mi } }
    pdbMinAvailable: null   # nginx.conf 가 pid/temp 를 /tmp(emptyDir) 로 쓰므로 추가 볼륨 불필요

# ---- vLLM (PGX / arm64 / GPU 1) ----
vllm:
  replicas: [llm-0]               # 운영 [llm-0, llm-1] → GPU 노드 1대이므로 1개
  image: ai/vllm-arm64            # 미러링 시 $TAG 로 태깅할 것 (rag.image 헬퍼가 global.imageTag 사용):
                                  #   docker tag nvcr.io/nvidia/vllm:<tag> $REG/ai/vllm-arm64:$TAG
                                  # ★ Qwen3.8-27B(qwen3_5 hybrid attention) 는 vLLM ≥ 0.17.0 필요 — 태그의 vLLM 버전 확인 (가이드 §3)
  nodeSelector:
    ragplatform.io/tier: llm      # 가이드 §1.2 라벨
  tolerations:
    - { key: dedicated, value: llm, operator: Equal, effect: NoSchedule }
  modelHostPath: /models          # PGX 로컬 경로. 모델 실체는 /models/llm/main (§2.1)
                                  # ※ sudo chmod -R a+rX /models
  # NGC vLLM 이미지가 비루트(10001) 기동에 실패하면 아래 주석을 풀어 예외를 명시한다 (§22.4 — 리포트에 기록)
  podSecurityContext: {}
  # podSecurityContext: { runAsNonRoot: false, runAsUser: 0 }
  # 랩 LLM = Qwen/Qwen3.8-27B-FP8 (dense 27B, FP8 ~31GB, 네이티브 262K ctx, vision-language + thinking 기본 on)
  #   → /models/llm/main 에 배치 (가이드 §2.1). served-model-name 은 그대로라 앱 설정 변경 없음.
  args:
    - --model=/models/llm/main
    - --served-model-name=internal-rag-llm
    - --max-model-len=16384           # RAG 예산(MAX_CONTEXT_TOKENS 8192 + 출력 1024)에 충분. 네이티브 262K 까지 가능
    - --gpu-memory-utilization=0.90   # 통합 메모리 공유 — OOM 시 0.85 로 하향 (가이드 §8)
    - --dtype=auto
    - --max-num-seqs=8                # 운영 16 → GB10 대역폭 고려
    - --language-model-only           # 텍스트 RAG — vision tower 미적재로 메모리/KV cache 확보
    - --reasoning-parser=qwen3        # thinking 이 켜져도 <think> 추론이 content 가 아닌 reasoning_content 로 분리
    - --disable-log-requests
    # (선택) 내장 MTP draft head 로 디코드 가속: --speculative-config={"method":"qwen3_5_mtp","num_speculative_tokens":3}
  # 통합 메모리(128GB) 구조상 memory limit 을 걸면 KV cache 할당과 충돌할 수 있어 requests 만 둔다
  resources:
    requests: { cpu: "8", memory: 32Gi }
    limits:   { nvidia.com/gpu: 1 }

# ---- parser-indexer Job 템플릿 (POSTGRES_* 는 dbEnv 헬퍼가 채운다) ----
ingestion:
  extraEnv:
    - { name: QDRANT_URL,        value: "http://qdrant.rag-data:6333" }
    - { name: EMBEDDING_API_URL, value: "http://embedding-api.rag-ai:8004" }
    - { name: DOCUMENT_STORAGE_PATH, value: "/data/documents" }
    - { name: OCR_ENABLED,       value: "0" }
    # CPU embedding: 64청크/요청이면 한글 문서에서 30s timeout 초과 → 작은 배치 + 넉넉한 timeout (가이드 §5.1.1)
    - { name: EMBEDDING_MAX_BATCH, value: "8" }
    - { name: EMBEDDING_TIMEOUT,   value: "120" }
    # 한글 실측 1.87자/토큰(bge-m3·KURE-v1 토크나이저) → CHUNK_SIZE=800 이 실제 ≈800 tok 이 되게 (기본 3.3 은 영문 기준,
    # 한글 청크가 ≈1,400 tok 로 커져 reranker max_length 1024 를 넘는다). 가이드 §5.1.2
    - { name: CHARS_PER_TOKEN,     value: "1.9" }
    # auto = PyMuPDF + 추출 순서가 깨진 페이지(MS Print-To-PDF)만 pdfplumber 대체
    - { name: PDF_TEXT_ENGINE,     value: "auto" }

monitoring:
  grafanaDashboards: false        # kube-prometheus-stack 설치 후 true (가이드 §9). true 면 monitoring NS 선재 필요

# ─────────────────────────────────────────────────────────────────────────────
# ⚠️ 사전 준비 항목 (가이드 §4.1 참조)
#
# 1) Namespace — rag-app/rag-ai/rag-data/rag-ingestion 을 먼저 만들고 `rag-platform=true` 라벨 (NetworkPolicy 전제).
# 2) Secret
#    - rag-app : `rag-chat-secrets`(jwt-secret, password-pepper, feedback-signing-key), `rag-chat-tls`(자체서명 TLS)
#    - rag-app / rag-data / rag-ingestion : `rag-postgresql-secret`(password) — global.postgres.existingSecret
#    chart 는 appServices.<svc>.secretMount.keys 에 나열한 키만 파일로 마운트하고 *_FILE env 를 채운다.
# 3) Ingress — chat host(`/api/v1`,`/ws` → chat-gateway · `/` → chat-web), admin host(`/api` → admin-api · `/` → admin-web).
# 4) 이미지 — `make build-images REG=registry.local:5000 TAG=$TAG && make push-images ...`
#    (chat-web 은 apps/chat-web/Containerfile — Next standalone, NEXT_PUBLIC_WS_URL 비움 = same-origin).
# ─────────────────────────────────────────────────────────────────────────────
