# values-lab.yaml — 로컬 2-Node RKE2 랩 (P3 amd64 + PGX arm64)
# 사용: rke2_two_node_test_guide.md §4
#   helm upgrade --install rag-platform deploy/helm/rag-platform \
#     -f deploy/helm/rag-platform/values-poc.yaml \
#     -f deploy/helm/rag-platform/values-lab.yaml \
#     --set global.imageTag=$TAG
#   ※ values-poc.yaml 위에 겹쳐 쓴다 (이 파일은 override 전용, 단독 사용 금지).
#
# 운영(PoC)과 다른 점 — 리포트에 반드시 기록할 것:
#   - vLLM replica 2 → 1 (GPU 노드 1대). NFR-HA-002 는 순차 재기동으로 대체 검증
#   - 앱 replica 2 → 1 (P3 20코어 한계). PDB 는 minAvailable 유지 시 rollout 이 막히므로 해제
#   - 데이터 계층 용량 축소 (NVMe 1TB 공유 — 가이드 §1.4.1)
#   - max-num-seqs 16 → 8 (GB10 메모리 대역폭 ~273GB/s 고려)
#
# ⚠️ 이 chart 가 아직 제공하지 않는 것 (랩 구동 전 별도 처리 필요) — 파일 하단 주석 참조
# ─────────────────────────────────────────────────────────────────────────────

global:
  imageRegistry: registry.local:5000
  imageTag: "dev"                 # --set global.imageTag=$(git rev-parse --short HEAD) 로 덮어쓴다
  imagePullPolicy: IfNotPresent

# ---- 스케줄링 ----
# 기본은 P3(amd64) 고정. PGX 는 dedicated=llm:NoSchedule taint 로도 막히지만,
# 이기종 클러스터에서 `exec format error` 를 원천 차단하려면 arch 라벨을 명시하는 편이 안전하다.
nodeSelector:
  kubernetes.io/arch: amd64
tolerations: []

# ---- 스토리지 티어 (가이드 §1.4 — 이 랩의 핵심) ----
data:
  storageClass: local-fast        # qdrant/postgresql/redis → NVMe
  # data 계층 image 는 global.imageRegistry 를 타지 않고 full string 이다 → 랩 레지스트리로 직접 교체.
  # 사전에 미러링: docker pull <원본> && docker tag ... registry.local:5000/library/<name> && docker push
  qdrant:
    image: registry.local:5000/library/qdrant:v1.12.1
    storage: 50Gi
    resources: { requests: { cpu: "2", memory: 8Gi } }
  postgresql:
    image: registry.local:5000/library/postgres:16
    storage: 20Gi
    resources: { requests: { cpu: "1", memory: 2Gi } }
  redis:
    image: registry.local:5000/library/redis:7
    storage: 10Gi
    resources: { requests: { cpu: "500m", memory: 1Gi } }

documentStorage:
  storageClass: local-bulk        # 문서 원본 → HDD
  size: 500Gi

modelStorage:
  create: false                   # PVC 대신 hostPath 사용 → 빈 models-pvc 를 만들지 않는다
  hostPath: /data/bulk/models     # §2.2 다운로드 위치. 컨테이너 /models 로 마운트
                                  # → /models/embedding/bge-m3, /models/reranker/bge-reranker-v2-m3
                                  # ※ 사전 조치: sudo chmod -R a+rX /data/bulk/models
                                  #   (Pod 는 runAsUser 10001, hostPath 에는 fsGroup 이 적용되지 않음)

# ---- 애플리케이션 서비스 ----
# 공통: replica 1, PDB 해제, 리소스 축소(P3 20코어/128GB), in-cluster URL 주입.
# env 키 이름은 TDD §10 / PRD 부록 B 가 SSOT — 임의 변경 금지.
appServices:
  mattermost-bridge:
    replicas: 1
    pdbMinAvailable: null
    resources: { requests: { cpu: "250m", memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
    extraEnv:
      - { name: REDIS_URL,     value: "redis://redis.rag-data:6379/0" }
      - { name: POSTGRES_HOST, value: "postgresql.rag-data" }
      - { name: BRIDGE_INTERNAL_URL, value: "http://mattermost-bridge.rag-app:8001" }
      - { name: LOG_LEVEL,     value: "INFO" }

  rag-api:
    replicas: 1
    pdbMinAvailable: null
    resources: { requests: { cpu: "500m", memory: 1Gi }, limits: { cpu: "2", memory: 3Gi } }
    extraEnv: &ragEnv
      - { name: REDIS_URL,         value: "redis://redis.rag-data:6379/0" }
      - { name: POSTGRES_HOST,     value: "postgresql.rag-data" }
      - { name: QDRANT_URL,        value: "http://qdrant.rag-data:6333" }
      - { name: EMBEDDING_API_URL, value: "http://embedding-api.rag-ai:8004" }
      - { name: RERANKER_API_URL,  value: "http://reranker-api.rag-ai:8005" }
      - { name: VLLM_API_URL,      value: "http://vllm-service.rag-ai:8000/v1" }
      - { name: LLM_SERVED_MODEL_NAME, value: "internal-rag-llm" }
      - { name: BRIDGE_INTERNAL_URL,   value: "http://mattermost-bridge.rag-app:8001" }
      # 동시 15 → GB10 대역폭 고려 8 (가이드 §7.2)
      - { name: CHAT_MAX_CONCURRENCY,  value: "8" }
      # tokenizer 는 LLM 노드(PGX)에만 있으므로 P3 의 rag-api 에서는 근사 카운팅 경로를 쓴다
      - { name: TOKENIZER_PATH,        value: "/models/llm/main" }

  rag-worker:
    replicas: 2                   # 가이드 §4 workerReplicaCount 2
    pdbMinAvailable: null
    resources: { requests: { cpu: "500m", memory: 1Gi }, limits: { cpu: "2", memory: 3Gi } }
    extraEnv: *ragEnv

  admin-api:
    replicas: 1
    pdbMinAvailable: null
    resources: { requests: { cpu: "500m", memory: 1Gi }, limits: { cpu: "2", memory: 2Gi } }
    extraEnv:
      - { name: POSTGRES_HOST, value: "postgresql.rag-data" }
      - { name: DOCUMENT_STORAGE_PATH, value: "/data/documents" }
      - { name: BRIDGE_INTERNAL_URL,   value: "http://mattermost-bridge.rag-app:8001" }
      - { name: APP_ENV,   value: "lab" }
      - { name: LOG_LEVEL, value: "INFO" }

  embedding-api:
    replicas: 1
    pdbMinAvailable: null
    # CPU 추론(bge-m3). P3 Core Ultra 7 265 기준 — 색인 처리량이 부족하면 cpu limit 을 올린다
    resources: { requests: { cpu: "2", memory: 4Gi }, limits: { cpu: "6", memory: 8Gi } }
    extraEnv:
      - { name: EMBEDDING_MODEL_PATH, value: "/models/embedding/bge-m3" }
      - { name: EMBEDDING_MOCK,       value: "0" }   # 실모델. 모델 미배치 시 "1"

  reranker-api:
    replicas: 1
    pdbMinAvailable: null
    resources: { requests: { cpu: "4", memory: 6Gi }, limits: { cpu: "8", memory: 12Gi } }
    extraEnv:
      - { name: RERANKER_MODEL_PATH, value: "/models/reranker/bge-reranker-v2-m3" }
      - { name: RERANKER_MOCK,       value: "0" }

# ---- vLLM (PGX / arm64 / GPU 1) ----
vllm:
  replicas: [llm-0]               # 운영 [llm-0, llm-1] → GPU 노드 1대이므로 1개
  image: ai/vllm-arm64            # 미러링 시 $TAG 로 태깅할 것 (rag.image 헬퍼가 global.imageTag 사용):
                                  #   docker tag nvcr.io/nvidia/vllm:latest $REG/ai/vllm-arm64:$TAG
  nodeSelector:
    ragplatform.io/tier: llm      # 가이드 §1.2 라벨
  tolerations:
    - { key: dedicated, value: llm, operator: Equal, effect: NoSchedule }
  modelHostPath: /models          # PGX 로컬 경로. 모델 실체는 /models/llm/main (§2.1)
                                  # ※ sudo chmod -R a+rX /models
  args:
    - --model=/models/llm/main
    - --served-model-name=internal-rag-llm
    - --max-model-len=16384
    - --gpu-memory-utilization=0.90   # 통합 메모리 공유 — OOM 시 0.85 로 하향 (가이드 §8)
    - --dtype=auto
    - --max-num-seqs=8                # 운영 16 → GB10 대역폭 고려
    - --disable-log-requests
  # 통합 메모리(128GB) 구조상 memory limit 을 걸면 KV cache 할당과 충돌할 수 있어 requests 만 둔다
  resources:
    requests: { cpu: "8", memory: 32Gi }
    limits:   { nvidia.com/gpu: 1 }

# ---- parser-indexer Job 템플릿 ----
ingestion:
  extraEnv:
    - { name: QDRANT_URL,        value: "http://qdrant.rag-data:6333" }
    - { name: EMBEDDING_API_URL, value: "http://embedding-api.rag-ai:8004" }
    - { name: POSTGRES_HOST,     value: "postgresql.rag-data" }
    - { name: DOCUMENT_STORAGE_PATH, value: "/data/documents" }
    - { name: OCR_ENABLED,       value: "0" }

monitoring:
  grafanaDashboards: true

# ─────────────────────────────────────────────────────────────────────────────
# ⚠️ chart 미지원 — 이 values 만으로는 채워지지 않는 항목 (가이드 §4 참조)
#
# 1) Secret 파일 마운트
#    bridge/rag-api 는 토큰을 env 가 아니라 **파일 경로**로 읽는다
#    (MATTERMOST_OUTGOING_TOKEN_SECRET_FILE, FEEDBACK_SIGNING_KEY_FILE,
#     MATTERMOST_SECRET_DIR). 현재 chart 는 `envFrom: secretRef` 만 지원하므로
#    Secret volume 마운트를 추가하거나, 배포 후 kubectl patch 로 주입해야 한다.
#
# 2) Ingress — chart 에 Ingress 템플릿이 없다. 가이드 §4.3 의 rag.lab.local 라우팅은
#    별도 매니페스트로 적용한다 (bridge /integrations, admin-api /api, admin-web /).
#
# 3) admin-web / mock-mattermost — appServices 에 정의가 없다. 랩에서 필요하면
#    여기 appServices 에 항목을 추가하면 그대로 Deployment+Service 가 생성된다.
#
# 4) POSTGRES_PASSWORD 등 DB 자격증명은 기본값(rag/rag-dev-only)을 그대로 쓴다.
#    폐쇄망 랩 한정이며 PoC 이관 시 Secret 으로 전환할 것.
# ─────────────────────────────────────────────────────────────────────────────
