{{/*
Web Chat / Admin Ingress (§14.1, §22.1) — ingress.enabled=true 일 때만 렌더. appServices 에 정의된 서비스만 라우팅한다.
chat host  (rag-chat) : /api/v1, /ws → chat-gateway · / → chat-web
                        동일 출처 필수 → refresh 쿠키 SameSite=Strict, WebSocket Origin 검사 통과. HTTPS 필수(WebCrypto prehash).
admin host (rag-admin): /api → admin-api · / → admin-web  (adminHost 지정 시)
  ⚠ admin-api 는 X-Auth-User 헤더를 신뢰한다(DEC-003). 운영에서는 이 Ingress 앞에 인증 프록시
    (oauth2-proxy 등)가 헤더를 주입/덮어써야 하며, 클라이언트가 임의로 보낸 헤더는 제거해야 한다.
*/}}
{{- define "rag.ingressPath" -}}
{{- $svc := index .root.Values.appServices .service }}
- path: {{ .path }}
  pathType: Prefix
  backend: { service: { name: {{ .service }}, port: { number: {{ $svc.port }} } } }
{{- end -}}
{{- if .Values.ingress.enabled }}
{{- $ing := .Values.ingress }}
{{- $apps := .Values.appServices }}
{{- if and $ing.chatHost (hasKey $apps "chat-gateway") }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rag-chat
  namespace: {{ (index $apps "chat-gateway").namespace }}
  labels:
    {{- include "rag.labels" (dict "name" "rag-chat" "root" $) | nindent 4 }}
  {{- /* socket.io websocket: 장시간 연결 유지 (nginx 기본 60s → 1h). Upgrade 헤더는 ingress-nginx 가 자동 처리.
         ingress.annotations 는 같은 키를 덮어쓴다 (중복 키 방지를 위해 dict 병합). */}}
  {{- $chatAnn := dict "nginx.ingress.kubernetes.io/proxy-read-timeout" "3600" "nginx.ingress.kubernetes.io/proxy-send-timeout" "3600" "nginx.ingress.kubernetes.io/proxy-body-size" "1m" }}
  annotations:
    {{- toYaml (mergeOverwrite $chatAnn (deepCopy ($ing.annotations | default dict))) | nindent 4 }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $ing.tlsSecretName }}
  tls:
    - hosts: [{{ $ing.chatHost | quote }}]
      secretName: {{ . }}
  {{- end }}
  rules:
    - host: {{ $ing.chatHost | quote }}
      http:
        paths:
          {{- include "rag.ingressPath" (dict "root" $ "path" "/api/v1" "service" "chat-gateway") | nindent 10 }}
          {{- include "rag.ingressPath" (dict "root" $ "path" "/ws" "service" "chat-gateway") | nindent 10 }}
          {{- if hasKey $apps "chat-web" }}
          {{- include "rag.ingressPath" (dict "root" $ "path" "/" "service" "chat-web") | nindent 10 }}
          {{- end }}
{{- end }}
{{- if and $ing.adminHost (hasKey $apps "admin-api") }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rag-admin
  namespace: {{ (index $apps "admin-api").namespace }}
  labels:
    {{- include "rag.labels" (dict "name" "rag-admin" "root" $) | nindent 4 }}
  {{- /* 문서 업로드: nginx 기본 1MB → admin-api MAX_UPLOAD_BYTES(100MB)와 맞춤 (가이드 §5.1.1) */}}
  {{- $adminAnn := dict "nginx.ingress.kubernetes.io/proxy-body-size" ($ing.adminProxyBodySize | default "100m") }}
  annotations:
    {{- toYaml (mergeOverwrite $adminAnn (deepCopy ($ing.annotations | default dict))) | nindent 4 }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with ($ing.adminTlsSecretName | default $ing.tlsSecretName) }}
  tls:
    - hosts: [{{ $ing.adminHost | quote }}]
      secretName: {{ . }}
  {{- end }}
  rules:
    - host: {{ $ing.adminHost | quote }}
      http:
        paths:
          {{- include "rag.ingressPath" (dict "root" $ "path" "/api" "service" "admin-api") | nindent 10 }}
          {{- if hasKey $apps "admin-web" }}
          {{- include "rag.ingressPath" (dict "root" $ "path" "/" "service" "admin-web") | nindent 10 }}
          {{- end }}
{{- end }}
{{- end }}
