{{/* parser-indexer Job 템플릿 (ConfigMap) — admin-api가 이 스펙을 인스턴스화한다 (ADR-008, §14.1). */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: parser-indexer-job-template
  namespace: {{ .Values.ingestion.namespace }}
  labels:
    app.kubernetes.io/part-of: rag-platform
data:
  job.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      generateName: index-job-
      namespace: {{ .Values.ingestion.namespace }}
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: Never
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          {{- with (.Values.ingestion.nodeSelector | default .Values.nodeSelector) }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with (.Values.ingestion.tolerations | default .Values.tolerations) }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: parser-indexer
              image: {{ include "rag.image" (dict "image" .Values.ingestion.image "root" .) }}
              command: ["python", "-m", "ingestion.main", "--index-job-id", "__INDEX_JOB_ID__"]
              env:
                {{- include "rag.offlineEnv" . | nindent 16 }}
                {{- include "rag.dbEnv" . | nindent 16 }}
                {{- with .Values.ingestion.extraEnv }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              {{- with .Values.ingestion.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              volumeMounts:
                - name: models
                  mountPath: /models
                  readOnly: true
                - name: documents
                  mountPath: {{ .Values.documentStorage.mountPath }}
          volumes:
            - name: models
              {{- if .Values.modelStorage.hostPath }}
              hostPath: { path: {{ .Values.modelStorage.hostPath | quote }}, type: Directory }
              {{- else }}
              persistentVolumeClaim: { claimName: models-pvc }
              {{- end }}
            - name: documents
              {{- if .Values.documentStorage.hostPath }}
              hostPath: { path: {{ .Values.documentStorage.hostPath | quote }}, type: Directory }
              {{- else }}
              persistentVolumeClaim: { claimName: documents-pvc }
              {{- end }}
