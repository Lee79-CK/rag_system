{{/* 공유 PVC — 모델(읽기전용, NFS §10.3)·문서 원본(NFS DEC-004).
     PVC는 namespace-scoped이므로 사용 namespace마다 생성한다. */}}
{{- if .Values.modelStorage.create }}
{{- range $ns := (list (index .Values.appServices "embedding-api").namespace .Values.ingestion.namespace) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models-pvc
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: rag-platform
spec:
  accessModes: ["ReadOnlyMany"]
  {{- with $.Values.modelStorage.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $.Values.modelStorage.size }}
{{- end }}
{{- end }}
{{- /* documentStorage.hostPath 지정 시(랩 단일 노드) PVC 를 만들지 않는다 — 두 NS 의 PVC 는 서로 다른 PV 라
       local-path 에서는 admin-api 업로드를 indexer 가 볼 수 없고, local-path 는 RWX 도 지원하지 않는다. */}}
{{- if not .Values.documentStorage.hostPath }}
{{- range $ns := (list "rag-app" .Values.ingestion.namespace) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: documents-pvc
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: rag-platform
spec:
  accessModes: ["ReadWriteMany"]
  {{- with $.Values.documentStorage.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $.Values.documentStorage.size }}
{{- end }}
{{- end }}
