{{/* 애플리케이션 서비스 Deployment + Service + PDB (§12.1). appServices map을 순회한다.
     서비스별 플래그: dbEnv / redisEnv / bridgeSecrets / incomingSecrets / modelVolume / documentVolume
     → 코드(config.py)가 기대하는 env 키·파일 경로를 chart 가 책임지고 채운다. */}}
{{- range $name, $svc := .Values.appServices }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $svc.namespace }}
  labels:
    {{- include "rag.labels" (dict "name" $name "root" $) | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: rag-platform
    spec:
      {{- with $svc.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      {{- with ($svc.nodeSelector | default $.Values.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with ($svc.tolerations | default $.Values.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "rag.image" (dict "image" $svc.image "root" $) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          {{- with $svc.command }}
          command: {{ toJson . }}
          {{- end }}
          {{- with $svc.args }}
          args: {{ toJson . }}
          {{- end }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          {{- if gt (int $svc.port) 0 }}
          ports:
            - containerPort: {{ $svc.port }}
          {{- end }}
          env:
            {{- include "rag.offlineEnv" $ | nindent 12 }}
            {{- if $svc.dbEnv }}
            {{- include "rag.dbEnv" $ | nindent 12 }}
            {{- end }}
            {{- if $svc.redisEnv }}
            {{- include "rag.redisEnv" $ | nindent 12 }}
            {{- end }}
            {{- if $svc.bridgeSecrets }}
            {{- include "rag.bridgeSecretEnv" $ | nindent 12 }}
            {{- end }}
            {{- if $svc.incomingSecrets }}
            {{- include "rag.incomingSecretEnv" $ | nindent 12 }}
            {{- end }}
            {{- with $svc.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if $svc.envFrom }}
          envFrom:
            {{- range $svc.envFrom }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          {{- if gt (int $svc.port) 0 }}
          livenessProbe:
            httpGet: { path: {{ $svc.livenessPath | default "/health/live" }}, port: {{ $svc.port }} }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: {{ $svc.readinessPath | default "/health/ready" }}, port: {{ $svc.port }} }
            periodSeconds: 10
          startupProbe:
            httpGet: { path: {{ $svc.startupPath | default "/health/startup" }}, port: {{ $svc.port }} }
            failureThreshold: {{ $svc.startupFailureThreshold | default 60 }}
            periodSeconds: 10
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $svc.modelVolume }}
            - name: models
              mountPath: /models
              readOnly: true
            {{- end }}
            {{- if $svc.documentVolume }}
            - name: documents
              mountPath: {{ $.Values.documentStorage.mountPath }}
            {{- end }}
            {{- if $svc.bridgeSecrets }}
            - name: rag-secrets
              mountPath: {{ $.Values.secretMounts.bridgeSecretsPath }}
              readOnly: true
            {{- end }}
            {{- if $svc.incomingSecrets }}
            - name: mm-incoming
              mountPath: {{ $.Values.secretMounts.incomingWebhookPath }}
              readOnly: true
            {{- end }}
            {{- range $svc.extraVolumeMounts }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $svc.modelVolume }}
        - name: models
          {{- if $.Values.modelStorage.hostPath }}
          hostPath: { path: {{ $.Values.modelStorage.hostPath | quote }}, type: Directory }
          {{- else }}
          persistentVolumeClaim:
            claimName: models-pvc
          {{- end }}
        {{- end }}
        {{- if $svc.documentVolume }}
        - name: documents
          persistentVolumeClaim:
            claimName: documents-pvc
        {{- end }}
        {{- if $svc.bridgeSecrets }}
        - name: rag-secrets
          secret:
            secretName: {{ $.Values.global.bridgeSecretName }}
            defaultMode: 0440
        {{- end }}
        {{- if $svc.incomingSecrets }}
        {{- include "rag.incomingProjectedVolume" $ | nindent 8 }}
        {{- end }}
        {{- range $svc.extraVolumes }}
        - {{ toYaml . | nindent 10 | trim }}
        {{- end }}
{{- if gt (int $svc.port) 0 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $svc.namespace }}
  labels:
    {{- include "rag.labels" (dict "name" $name "root" $) | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
{{- end }}
{{- if $svc.pdbMinAvailable }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  namespace: {{ $svc.namespace }}
spec:
  minAvailable: {{ $svc.pdbMinAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
{{- end }}
{{- end }}
