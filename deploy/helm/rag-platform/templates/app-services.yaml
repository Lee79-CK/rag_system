{{/* 애플리케이션 서비스 Deployment + Service + PDB (§12.1). appServices map을 순회한다.
     서비스별 플래그: dbEnv / redisEnv / secretMount.keys / modelVolume / documentVolume
     / probePath(또는 livenessPath·readinessPath·startupPath) / startupFailureThreshold
     → 코드(config.py)가 기대하는 env 키·파일 경로를 chart 가 책임지고 채운다. */}}
{{- range $name, $svc := .Values.appServices }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $svc.namespace }}
  labels:
    {{- include "rag.labels" (dict "name" $name "root" $) | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: rag-platform
    spec:
      {{- with $svc.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      {{- with ($svc.nodeSelector | default $.Values.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with ($svc.tolerations | default $.Values.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "rag.image" (dict "image" $svc.image "root" $) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          {{- with $svc.command }}
          command: {{ toJson . }}
          {{- end }}
          {{- with $svc.args }}
          args: {{ toJson . }}
          {{- end }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          {{- if gt (int $svc.port) 0 }}
          ports:
            - containerPort: {{ $svc.port }}
          {{- end }}
          env:
            {{- include "rag.offlineEnv" $ | nindent 12 }}
            {{- if $svc.dbEnv }}
            {{- include "rag.dbEnv" $ | nindent 12 }}
            {{- end }}
            {{- if $svc.redisEnv }}
            {{- include "rag.redisEnv" $ | nindent 12 }}
            {{- end }}
            {{- if $svc.secretMount }}
            {{- include "rag.chatSecretEnv" (dict "svc" $svc "root" $) | nindent 12 }}
            {{- end }}
            {{- with $svc.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if $svc.envFrom }}
          envFrom:
            {{- range $svc.envFrom }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          {{- if gt (int $svc.port) 0 }}
          {{- /* 개별 경로(livenessPath 등) > probePath(3종 공통, 예: chat-web /health/live) > /health/* */}}
          livenessProbe:
            httpGet: { path: {{ $svc.livenessPath | default $svc.probePath | default "/health/live" }}, port: {{ $svc.port }} }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: {{ $svc.readinessPath | default $svc.probePath | default "/health/ready" }}, port: {{ $svc.port }} }
            periodSeconds: 10
          startupProbe:
            httpGet: { path: {{ $svc.startupPath | default $svc.probePath | default "/health/startup" }}, port: {{ $svc.port }} }
            failureThreshold: {{ $svc.startupFailureThreshold | default 60 }}
            periodSeconds: 10
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $svc.secretMount }}
            # Secret 파일 마운트 (*_FILE env 가 가리키는 경로) — 값은 env/로그에 노출되지 않는다 (§3.2)
            - name: secret-files
              mountPath: {{ $svc.secretMount.mountPath | default $.Values.secretMounts.chatSecretsPath }}
              readOnly: true
            {{- end }}
            {{- if $svc.modelVolume }}
            - name: models
              mountPath: /models
              readOnly: true
            {{- end }}
            {{- if $svc.documentVolume }}
            - name: documents
              mountPath: {{ $.Values.documentStorage.mountPath }}
            {{- end }}
            {{- range $svc.extraVolumeMounts }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $svc.secretMount }}
        - name: secret-files
          secret:
            secretName: {{ $svc.secretMount.secretName | default $.Values.global.chatSecretName }}
            defaultMode: 0440   # 비루트(10001) + fsGroup 로 읽기. 필요한 키만 투영 (최소 권한)
            items:
              {{- range $svc.secretMount.keys }}
              - { key: {{ . }}, path: {{ . }} }
              {{- end }}
        {{- end }}
        {{- if $svc.modelVolume }}
        - name: models
          {{- if $.Values.modelStorage.hostPath }}
          hostPath: { path: {{ $.Values.modelStorage.hostPath | quote }}, type: Directory }
          {{- else }}
          persistentVolumeClaim:
            claimName: models-pvc
          {{- end }}
        {{- end }}
        {{- if $svc.documentVolume }}
        - name: documents
          persistentVolumeClaim:
            claimName: documents-pvc
        {{- end }}
        {{- range $svc.extraVolumes }}
        - {{ toYaml . | nindent 10 | trim }}
        {{- end }}
{{- if gt (int $svc.port) 0 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $svc.namespace }}
  labels:
    {{- include "rag.labels" (dict "name" $name "root" $) | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
{{- end }}
{{- if $svc.pdbMinAvailable }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  namespace: {{ $svc.namespace }}
spec:
  minAvailable: {{ $svc.pdbMinAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
{{- end }}
{{- end }}
