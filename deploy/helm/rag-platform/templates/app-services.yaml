{{/* 애플리케이션 서비스 Deployment + Service + PDB (§12.1). appServices map을 순회한다. */}}
{{- range $name, $svc := .Values.appServices }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $svc.namespace }}
  labels:
    {{- include "rag.labels" (dict "name" $name "root" $) | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: rag-platform
    spec:
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $name }}
          image: {{ include "rag.image" (dict "image" $svc.image "root" $) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          command: {{ toJson $svc.command }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          {{- if gt (int $svc.port) 0 }}
          ports:
            - containerPort: {{ $svc.port }}
          {{- end }}
          env:
            {{- include "rag.offlineEnv" $ | nindent 12 }}
          {{- if $svc.envFrom }}
          envFrom:
            {{- range $svc.envFrom }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          {{- if gt (int $svc.port) 0 }}
          livenessProbe:
            httpGet: { path: /health/live, port: {{ $svc.port }} }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: {{ $svc.port }} }
            periodSeconds: 10
          startupProbe:
            httpGet: { path: /health/startup, port: {{ $svc.port }} }
            failureThreshold: 60
            periodSeconds: 10
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $svc.modelVolume }}
            - name: models
              mountPath: /models
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $svc.modelVolume }}
        - name: models
          persistentVolumeClaim:
            claimName: models-pvc
        {{- end }}
{{- if gt (int $svc.port) 0 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $svc.namespace }}
  labels:
    {{- include "rag.labels" (dict "name" $name "root" $) | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
{{- end }}
{{- if $svc.pdbMinAvailable }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  namespace: {{ $svc.namespace }}
spec:
  minAvailable: {{ $svc.pdbMinAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
{{- end }}
{{- end }}
