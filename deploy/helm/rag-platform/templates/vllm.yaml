{{/* vLLM — llm-0/llm-1 Deployment(각 GPU 1) + 공통 Service (ADR-009, §8). */}}
{{- $v := .Values.vllm }}
{{- /* 모델 교체 = vllm.modelDir 만 변경. --model / --served-model-name 은 템플릿이 만든다 → args 에 중복 지정 금지 */}}
{{- if not $v.modelDir }}{{ fail "vllm.modelDir 가 비어 있습니다 (/models 아래 LLM 디렉터리 이름)" }}{{ end }}
{{- range $a := $v.args }}
{{- if or (hasPrefix "--model" $a) (hasPrefix "--served-model-name" $a) }}
{{- fail (printf "vllm.args 에 %q 를 넣지 마세요 — vllm.modelDir / vllm.servedModelName 으로 지정합니다" $a) }}
{{- end }}
{{- end }}
{{- $modelPath := printf "/models/%s" (trimPrefix "/" $v.modelDir) }}
{{- /* serveCommand 는 args 맨 앞에 붙는다 — command 를 덮지 않으므로 이미지 ENTRYPOINT(NGC 의 CUDA 호환 설정 등)는 유지된다 */}}
{{- $args := concat ($v.serveCommand | default list) (list (printf "--model=%s" $modelPath) (printf "--served-model-name=%s" $v.servedModelName)) $v.args }}
{{- range $replica := $v.replicas }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-{{ $replica }}
  namespace: {{ $v.namespace }}
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/part-of: rag-platform
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }   # GPU 2장 한도 내 순차 교체 (§14.2)
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
      vllm-replica: {{ $replica }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
        vllm-replica: {{ $replica }}
      annotations:
        ragplatform.io/llm-model: {{ $modelPath | quote }}   # 현재 서빙 중인 모델 디렉터리 (kubectl describe 로 확인)
    spec:
      securityContext:
        {{- /* NGC vLLM 이미지가 root 전제라면 vllm.podSecurityContext 로 runAsNonRoot/runAsUser 를 덮어쓴다 (예외는 문서화 §22.4) */}}
        {{- toYaml (mergeOverwrite (deepCopy $.Values.podSecurityContext) ($v.podSecurityContext | default dict)) | nindent 8 }}
      {{- with ($v.nodeSelector | default $.Values.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with ($v.tolerations | default $.Values.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: vllm
          image: {{ include "rag.image" (dict "image" $v.image "root" $) }}
          args: {{ toJson $args }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
            readOnlyRootFilesystem: {{ $v.securityContext.readOnlyRootFilesystem }}
          ports:
            - containerPort: 8000
          env:
            {{- include "rag.offlineEnv" $ | nindent 12 }}
            {{- /* 비루트 uid 10001 은 이미지 /etc/passwd 에 없어 HOME=/ → vLLM·flashinfer·triton 이 /.cache 생성 시
                   PermissionError. 쓰기 가능한 emptyDir 을 HOME 으로 지정한다 (USER 는 torch getpass.getuser() 용). */}}
            - { name: HOME, value: /home/vllm }
            - { name: XDG_CACHE_HOME, value: /home/vllm/.cache }
            - { name: USER, value: vllm }
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            failureThreshold: 60
            periodSeconds: 10          # 모델 로딩 최대 10분 (NFR-HA-008)
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: home
              mountPath: /home/vllm
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: home              # 컴파일/JIT 캐시 (torch.compile·flashinfer·triton). Pod 재생성 시 초기화
          emptyDir: {}
        - name: dshm              # 기본 64MB shm 은 vLLM 프로세스 간 통신에 부족 (NGC 권고 --ipc=host 대체)
          emptyDir: { medium: Memory, sizeLimit: {{ $v.shmSize | default "8Gi" }} }
        - name: models
          {{- /* GPU 노드가 앱 노드와 다른 이기종 랩에서는 models-pvc(앱 노드 local-path)를
                 GPU 노드에서 쓸 수 없다 → 해당 노드 로컬 경로를 직접 마운트한다. */}}
          {{- if $v.modelHostPath }}
          hostPath: { path: {{ $v.modelHostPath | quote }}, type: Directory }
          {{- else }}
          persistentVolumeClaim:
            claimName: models-pvc
          {{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-service
  namespace: {{ $v.namespace }}
spec:
  selector:
    app.kubernetes.io/name: vllm      # llm-0/llm-1 공통 label → LB
  ports:
    - port: 8000
      targetPort: 8000
