# PoC(운영) 프로파일 — values.yaml 위에 겹쳐 쓰는 override. docs/PRD.md §12 리소스, docs/TDD.md §14.
#   helm upgrade --install rag-platform deploy/helm/rag-platform -f deploy/helm/rag-platform/values-poc.yaml
# 이미지는 내부 Harbor digest 고정(§14.2). 리소스·replica 는 PRD §12.1~12.2 값 그대로.
# Namespace(라벨 rag-platform=true) / Secret(rag-chat-secrets, rag-postgresql-secret, TLS) 은 사전 생성 전제.
global:
  imageRegistry: harbor.internal
  imageTag: "0.1.0"          # --set global.imageTag=<git-sha> 로 override
  imagePullPolicy: IfNotPresent

networkPolicy:
  ingressController:
    namespace: ingress-nginx  # 운영 Ingress Controller NS 에 맞춘다

ingress:
  enabled: true
  className: nginx
  chatHost: chat.rag.internal     # 사용자 Web Chat (chat-web + chat-gateway 동일 출처)
  adminHost: rag.internal         # 관리자 (admin-api /api, admin-web /)
  # 운영: 인증 프록시(oauth2-proxy 등)가 admin host 에 X-Auth-User 를 주입한다 (DEC-003). 클라이언트 헤더는 프록시에서 제거.
  tlsSecretName: rag-chat-tls     # 필수 — HTTP 로는 브라우저 WebCrypto(prehash 로그인) 불가
  annotations: {}

migration:
  enabled: true              # post-install/upgrade 마다 alembic upgrade head

appServices:
  # 이미지/command/env/Secret 마운트는 values.yaml 기준선을 그대로 쓴다 (list 는 override 시 통째로 교체되므로 여기서 재정의 금지)
  chat-gateway:
    replicas: 2
    resources: { requests: { cpu: "2", memory: 4Gi }, limits: { cpu: "4", memory: 8Gi } }
    pdbMinAvailable: 1
  chat-web:
    replicas: 2
    resources: { requests: { cpu: "500m", memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
    pdbMinAvailable: 1
  rag-api:
    replicas: 2
    resources: { requests: { cpu: "4", memory: 8Gi }, limits: { cpu: "6", memory: 12Gi } }
    pdbMinAvailable: 1
  rag-worker:
    replicas: 2
    resources: { requests: { cpu: "4", memory: 8Gi }, limits: { cpu: "6", memory: 12Gi } }
    pdbMinAvailable: 1
  admin-api:
    replicas: 2
    resources: { requests: { cpu: "2", memory: 4Gi }, limits: { cpu: "3", memory: 6Gi } }
    pdbMinAvailable: 1
  embedding-api:
    replicas: 2
    resources: { requests: { cpu: "4", memory: 12Gi }, limits: { cpu: "6", memory: 16Gi } }
    pdbMinAvailable: 1
  reranker-api:
    replicas: 2
    resources: { requests: { cpu: "8", memory: 16Gi }, limits: { cpu: "12", memory: 24Gi } }
    pdbMinAvailable: 1

# ---- vLLM (GPU) — ADR-009: GPU 1장 = Replica 1, 2장 = llm-0/llm-1 ----
vllm:
  image: rag/vllm-openai
  replicas: [llm-0, llm-1]
  resources: { requests: { cpu: "12", memory: 64Gi }, limits: { cpu: "16", memory: 96Gi, "nvidia.com/gpu": 1 } }

# ---- 데이터 계층 (rag-data namespace) — 운영은 NFS default SC 전제(storageClass 비움) ----
data:
  qdrant:
    image: harbor.internal/library/qdrant:v1.12.1
    storage: 500Gi
    resources: { requests: { cpu: "8", memory: 32Gi } }
  postgresql:
    image: harbor.internal/library/postgres:16
    storage: 200Gi
    resources: { requests: { cpu: "4", memory: 16Gi } }
  redis:
    image: harbor.internal/library/redis:7
    storage: 20Gi
    resources: { requests: { cpu: "2", memory: 4Gi } }

monitoring:
  grafanaDashboards: true
  namespace: monitoring
