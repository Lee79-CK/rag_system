[project]
name = "rag-observability"
version = "0.1.0"
description = "structlog 설정 + prometheus 공통 metric + secret 마스킹 — docs/TDD.md §12"
requires-python = ">=3.12,<3.13"
dependencies = [
    "structlog>=24.1",
    "prometheus-client>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_observability"]
