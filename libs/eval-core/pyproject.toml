[project]
name = "rag-eval"
version = "0.1.0"
description = "RAG 품질 평가 공용 모델·지표 (§13.3) — tools/evaluation CLI 와 admin-api 포털 평가 실행이 함께 쓴다"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_eval"]
