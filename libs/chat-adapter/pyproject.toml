[project]
name = "chat-adapter"
version = "0.1.0"
description = "Web Chat 답변 렌더링(blocks) + PostDto 매핑 + socket.io 스트리밍 Emitter — docs/TDD.md §7.1.2/§7.2.5"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rag-schemas",
    "python-socketio>=5.11",
    "redis>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_adapter"]
