[project]
name = "mattermost-adapter"
version = "0.1.0"
description = "Mattermost payload 정규화 + 답변 렌더링 + Incoming Webhook 게시 — docs/TDD.md §7.1.2/§7.2.5"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rag-schemas",
    "rag-common",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mattermost_adapter"]
