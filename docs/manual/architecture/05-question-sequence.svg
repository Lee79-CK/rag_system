="url(#f5-a-v)"/><rect x="627.0" y="421.0" width="202.6" height="19.0" rx="4" class="lbg"/><text x="632" y="434" class="al" text-anchor="start" >⑧ 벡터 검색 상위 12개 + 채널 필터</text><path d="M628,488 L1021,488" class="ar-v" marker-end="url(#f5-a-v)"/><rect x="627.0" y="467.0" width="269.6" height="19.0" rx="4" class="lbg"/><text x="632" y="480" class="al" text-anchor="start" >⑨ 관련도 재정렬 (45초 넘으면 검색 순서 사용)</text><path d="M628,534 L1156,534" class="ar-v" marker-end="url(#f5-a-v)"/><rect x="627.0" y="513.0" width="230.3" height="19.0" rx="4" class="lbg"/><text x="632" y="526" class="al" text-anchor="start" >⑩ 근거를 넣어 답변 요청  stream=True</text><path d="M1160,580 L632,580" class="ar-r dash" marker-end="url(#f5-a-r)"/><rect x="627.0" y="559.0" width="169.8" height="19.0" rx="4" class="lbg"/><text x="632" y="572" class="al" text-anchor="start" >⑪ 토큰이 생성되는 대로 전송</text><path d="M612,626 L489,626" class="ar-v" marker-end="url(#f5-a-v)"/><rect x="445.7" y="605.0" width="165.3" height="19.0" rx="4" class="lbg"/><text x="606" y="618" class="al" text-anchor="end" >⑫ llm.stream.delta 발행</text><path d="M485,672 L219,672" class="ar-o dash" marker-end="url(#f5-a-o)"/><rect x="245.0" y="651.0" width="210.0" height="19.0" rx="4" class="lbg"/><text x="350.0" y="664" class="al" text-anchor="middle" >⑬ Redis pub/sub → 모든 gateway</text><path d="M215,718 L84,718" class="ar-o" marker-end="url(#f5-a-o)"/><rect x="83.0" y="697.0" width="231.5" height="19.0" rx="4" class="lbg"/><text x="88" y="710" class="al" text-anchor="start" >⑭ 채널 방(room) 멤버 화면에 글자 표시</text><path d="M612,764 L354,764" class="ar-v" marker-end="url(#f5-a-v)"/><rect x="383.6" y="743.0" width="227.4" height="19.0" rx="4" class="lbg"/><text x="606" y="756" class="al" text-anchor="end" >⑮ 최종 답변 + 근거 표 저장, 작업 DONE</text><path d="M612,810 L84,810" class="ar-o dash" marker-end="url(#f5-a-o)"/><rect x="128.5" y="789.0" width="443.0" height="19.0" rx="4" class="lbg"/><text x="350.0" y="802" class="al" text-anchor="middle" >⑯ post.updated + llm.stream.end → 화면 확정 (Redis → gateway 경유)</text><rect x="640" y="846" width="570" height="82" rx="8" class="note" /><text x="652" y="867.2" class="alb" text-anchor="start" >체감 시간 (랩 기준)</text><text x="652" y="883.2" class="sm" text-anchor="start" >① ~ ④ 접수: 1초 이내 · ⑦ ~ ⑨ 검색·재정렬: 수 초 (CPU)</text><text x="652" y="899.2" class="sm" text-anchor="start" >⑩ ~ ⑭ 답변 생성: 답변 길이에 따라 수십 초 — 그동안 글자가 계속 나타남</text><text x="652" y="915.2" class="sm" text-anchor="start" >⑫ 토큰은 50ms 또는 64자 단위로 묶어 발행 (화면 부하 감소)</text></svg>