115.5" class="t" text-anchor="middle" >⑤ Pod 교체</text><text x="1093.0" y="132.7" class="m" text-anchor="middle" >새 이미지 pull</text><text x="1093.0" y="148.7" class="sm" text-anchor="middle" >DB 마이그레이션 Job</text><path d="M958,126 L985,126" class="ar" marker-end="url(#f8-a)"/><rect x="10" y="236" width="1200" height="80" rx="8" class="note" /><text x="22" y="264.2" class="alb" text-anchor="start" >예외 — vLLM 이미지 (arm64)</text><text x="22" y="280.2" class="sm" text-anchor="start" >PGX 용 vLLM 이미지(registry.local:5000/ai/vllm-arm64)는 이 스크립트로 빌드하지 않고 별도로 미러링한다.  모델 교체는 values-lab 의 vllm.modelDir 값 하나로 한다.</text><text x="22" y="296.2" class="sm" text-anchor="start" >폐쇄망이라 빌드·실행 중 인터넷에서 아무것도 받지 않는다 (모델·패키지 모두 미리 반입).</text></svg>