rker-end="url(#f6-a)"/><rect x="20" y="560" width="1180" height="66" rx="8" class="note" /><text x="32" y="589.2" class="alb" text-anchor="start" >참고 (랩 실측 2026-10-11)</text><text x="32" y="605.2" class="sm" text-anchor="start" >표가 많은 345쪽 PDF → 1,398 조각, 전체 ≈ 85분 중 임베딩이 ≈ 83분.  진행률은 admin-web &#x27;색인 작업&#x27; 화면에서 실시간으로 확인 (임베딩 단계는 10초마다 갱신).  실패하면 단계와 오류가 index_jobs 에 남고 [재시도] 가능.</text></svg>