[project]
name = "evaluation"
version = "0.1.0"
description = "RAG 품질 평가 runner (§13.3) — Recall@10, Citation Precision, 무근거 안전응답률"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.7", "pyyaml>=6.0", "httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evaluation"]
