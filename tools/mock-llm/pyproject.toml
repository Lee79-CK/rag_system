[project]
name = "mock-llm"
version = "0.1.0"
description = "로컬 개발용 OpenAI-compatible mock LLM (:8010) — docs/README.md §5.4"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mock_llm"]
