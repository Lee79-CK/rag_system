[project]
name = "mock-mattermost"
version = "0.1.0"
description = "Mattermost Incoming Webhook 수신 mock (:9099) — 게시 payload 확인용. 운영 미배포."
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "orjson>=3.10"]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mock_mattermost"]
