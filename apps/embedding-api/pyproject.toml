[project]
name = "embedding-api"
version = "0.1.0"
description = "BGE-M3 CPU Embedding Serving (FastAPI) — docs/TDD.md §7.3"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "numpy>=1.26",
    "orjson>=3.10",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "rag-schemas",
    "rag-common",
    "rag-observability",
]

[project.optional-dependencies]
# 실 모델 서빙 (GPU/CPU 노드). 로컬 Intel macOS에는 미설치 — mock 엔진 사용.
# transformers 5.x 는 tokenizer.prepare_for_model 제거 → FlagEmbedding 1.4 reranker 가 AttributeError (메타데이터는 <6 허용)
models = ["FlagEmbedding>=1.2", "torch>=2.2", "transformers>=4.44.2,<5"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/embedding"]
