# Alembic 설정 — admin-api (docs/TDD.md §5). Migration은 Postgres를 대상으로 한다.
[alembic]
script_location = %(here)s
prepend_sys_path = .
version_locations = %(here)s/versions
# sqlalchemy.url 은 env.py 에서 admin.core.config 로 주입한다.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
