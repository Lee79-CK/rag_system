[project]
name = "chat-gateway"
version = "0.1.0"
description = "Web Chat Gateway (FastAPI + socket.io) — chat-web(aiops_chatbot 이식) 백엔드. docs/TDD.md §7.1"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-socketio>=5.11",
    "redis>=5.0",
    "rq>=1.16",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "orjson>=3.10",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "rag-schemas",
    "rag-common",
    "rag-observability",
    "chat-adapter",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27", "fakeredis>=2.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]
