# admin-web nginx — 비루트/readOnlyRootFilesystem 대응 (쓰기 경로는 /tmp 만).
pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    sendfile      on;
    server_tokens off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    server {
        listen 8080;
        root   /usr/share/nginx/html;
        index  index.html;

        # K8s probe (chart: /health/live|ready|startup)
        location ~ ^/health/(live|ready|startup)$ { return 200 '{"status":"ok"}'; add_header Content-Type application/json; }

        # SPA fallback — /api 는 Ingress 가 admin-api 로 라우팅하므로 여기 도달하지 않는다
        location / { try_files $uri $uri/ /index.html; }

        location ~* \.(js|css|svg|png|woff2?)$ { expires 7d; add_header Cache-Control "public"; }
    }
}
