[project]
name = "parser-indexer"
version = "0.1.0"
description = "문서 파싱+색인 K8s Job (CLI) — docs/TDD.md §7.7"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "qdrant-client>=1.11",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "python-pptx>=0.6",
    "openpyxl>=3.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "langchain-text-splitters>=0.2",
    "orjson>=3.10",
    "structlog>=24.1",
    "rag-schemas",
    "rag-common",
    "rag-observability",
]

[project.optional-dependencies]
ocr = ["paddleocr>=2.7", "paddlepaddle>=2.6"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]
