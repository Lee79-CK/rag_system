[project]
name = "rag-api"
version = "0.1.0"
description = "RAG Orchestration (FastAPI + Worker) — docs/TDD.md §7.2"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "openai>=1.40",
    "qdrant-client>=1.12,<1.14",  # 서버 qdrant v1.12.1 과 minor 차이 ≤1 (클라이언트 호환 규칙)
    "redis>=5.0",
    "rq>=1.16",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "orjson>=3.10",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "rag-schemas",
    "rag-common",
    "rag-observability",
    "chat-adapter",
]

[project.optional-dependencies]
# 로컬 토크나이저(모델 배치 시). 미설치 시 heuristic 토큰 카운터 fallback.
tokenizer = ["transformers>=4.44"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27", "fakeredis>=2.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]
