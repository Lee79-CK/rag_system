[project]
name = "mattermost-bridge"
version = "0.1.0"
description = "Webhook 수신/응답 Adapter (FastAPI) — docs/TDD.md §7.1"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "redis>=5.0",
    "rq>=1.16",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "orjson>=3.10",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "rag-schemas",
    "rag-common",
    "rag-observability",
    "mattermost-adapter",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27", "fakeredis>=2.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bridge"]
