# Root uv workspace for the RAG Platform monorepo.
# See docs/TDD.md §2 for the canonical repository structure.
[project]
name = "rag-platform"
version = "0.1.0"
description = "Web Chat(aiops_chatbot 이식) 기반 폐쇄형 Private Cloud RAG LLM 챗봇 (monorepo root)"
requires-python = ">=3.12,<3.13"

[tool.uv.workspace]
members = ["apps/*", "libs/*", "tools/*"]
exclude = ["apps/admin-web", "apps/chat-web"]  # React(Vite/Next) 앱 — Python 워크스페이스 멤버 아님

# Intra-repo dependencies resolve to the workspace members (editable), never PyPI.
[tool.uv.sources]
rag-schemas = { workspace = true }
rag-common = { workspace = true }
rag-observability = { workspace = true }
chat-adapter = { workspace = true }

[dependency-groups]
# Dev tooling shared across every member.
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "testcontainers>=4.8",
    "docker>=7.1",
    "locust>=2.31",
]

# ---- Lint / format / type-check (§3.1) ----
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps", "libs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q"
testpaths = ["libs", "apps", "tests"]
filterwarnings = ["ignore::DeprecationWarning"]
